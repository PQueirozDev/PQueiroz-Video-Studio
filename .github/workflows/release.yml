name: Release

# Gera os instaladores na nuvem e anexa ao release da versão:
# - Windows (.exe + latest.yml do auto-update) em windows-latest
# - Linux (AppImage, .deb + latest-linux.yml) em ubuntu-latest
# Para publicar: atualize "version" no package.json e envie a tag (ex.: git tag v0.2.3 && git push origin v0.2.3).
# As notas do release vêm de docs/releases/<tag>.md, se existir.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release que recebe os arquivos (ex. v0.2.3)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Criar o release (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe."
          elif [ -f "docs/releases/$TAG.md" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "docs/releases/$TAG.md" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber
